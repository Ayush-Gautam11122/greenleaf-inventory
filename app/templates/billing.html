{% extends "base.html" %}{% block title %}Billing{% endblock %}{% block body %}<h1>New bill</h1>
<form method="post" class="card" id="f"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row"><div><label>Search product</label><input id="q" placeholder="type to filter…" autofocus></div>
<div style="flex:1;min-width:260px"><label>Product</label><select id="sel" style="width:100%"></select></div>
<div><label>Qty</label><input id="qty" type="number" min="1" value="1" style="width:80px"></div>
<button type="button" class="btn" id="add">Add</button></div>
<table id="t"><thead><tr><th>Item</th><th class="n">Price</th><th class="n">Qty</th><th class="n">Total</th><th></th></tr></thead><tbody></tbody></table>
<div class="row" style="margin-top:14px;justify-content:space-between"><div><label>Discount %</label><input name="discount" id="disc" type="number" min="0" max="100" step="0.5" value="0" style="width:100px"></div>
<div style="text-align:right">Subtotal: <b id="sub">₹0.00</b><br>Total: <b id="tot" style="font-size:22px">₹0.00</b></div></div>
<button class="btn" id="go">Create bill</button></form>
<script>
const P={{ products|tojson }},sel=document.getElementById('sel'),q=document.getElementById('q'),tb=document.querySelector('#t tbody');
const fmt=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function fill(){const t=q.value.toLowerCase();sel.innerHTML='';P.filter(p=>p.name.toLowerCase().includes(t)||p.category.toLowerCase().includes(t)).forEach(p=>{const o=document.createElement('option');o.value=p.product_id;o.textContent=`${p.name} — ${fmt(p.unit_price)} (${p.stock_qty} in stock)`;sel.appendChild(o)})}
function calc(){let s=0;tb.querySelectorAll('tr').forEach(r=>{const p=P.find(x=>x.product_id==r.dataset.id),n=parseInt(r.querySelector('input[name=quantity]').value)||0;const l=p.unit_price*n;r.querySelector('.lt').textContent=fmt(l);s+=l});
const d=Math.min(100,Math.max(0,parseFloat(document.getElementById('disc').value)||0));document.getElementById('sub').textContent=fmt(s);document.getElementById('tot').textContent=fmt(s*(1-d/100))}
document.getElementById('add').onclick=()=>{const id=sel.value;if(!id)return;const p=P.find(x=>x.product_id==id);let n=parseInt(document.getElementById('qty').value)||0;
if(n<1){alert('Quantity must be at least 1.');return}
let ex=tb.querySelector(`tr[data-id="${id}"]`);if(ex){const i=ex.querySelector('input[name=quantity]');i.value=(+i.value)+n;if(+i.value>p.stock_qty){i.value=p.stock_qty;alert('Only '+p.stock_qty+' in stock.')}calc();return}
if(n>p.stock_qty){alert('Only '+p.stock_qty+' in stock.');return}
const r=document.createElement('tr');r.dataset.id=id;r.innerHTML=`<td>${p.name.replace(/</g,'&lt;')}<input type="hidden" name="product_id" value="${id}"></td><td class="n">${fmt(p.unit_price)}</td><td class="n"><input name="quantity" type="number" min="1" max="${p.stock_qty}" value="${n}" style="width:80px"></td><td class="n lt"></td><td><button type="button" class="btn red sm">✕</button></td>`;
r.querySelector('button').onclick=()=>{r.remove();calc()};r.querySelector('input[name=quantity]').oninput=calc;tb.appendChild(r);calc()};
q.oninput=fill;document.getElementById('disc').oninput=calc;
document.getElementById('f').onsubmit=e=>{if(!tb.children.length){e.preventDefault();alert('Add at least one item.')}};fill();
</script>{% endblock %}
